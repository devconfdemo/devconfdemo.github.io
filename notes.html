<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Speaker notes</title>
    <script src="/js/tp/vimeshui.js"></script>
    <script src="/js/tp/alpine.js" defer></script>

    <link href="https://cdn.jsdelivr.net/npm/daisyui@4.12.7/dist/full.min.css" rel="stylesheet" type="text/css" />
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="/js/presentatie.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/webpeerjs@0.1/dist/umd/webpeerjs.min.js"></script>
</head>
<body>
    <div x-data="notes">
        <div class="card bg-base-100 w-[100vw]">
            <div class="card-body">
                <h2 class="card-title text-9xl font-bold" x-text="slide"></h2>
                <!-- Maak de inhoud groter -->
                <template x-for="line in content.split('\n\n')">
                    <p class="text-6xl mt-5" x-text="line"></p>
                </template>

            </div>
        </div>

    </div>
</body>
</html>
