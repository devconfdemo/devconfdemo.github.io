<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <meta name="description" content="" />
    <title>The story behind Tracepaper slides</title>

    <link rel="stylesheet" href="/css/draftsman.css" />
    <script src="https://cdn.jsdelivr.net/npm/@alpinejs/persist@3.x.x/dist/cdn.min.js"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/@alpinejs/intersect@3.x.x/dist/cdn.min.js"></script>
    <script src="/js/tp/alpine.js" defer></script>
    <script src="/js/slide-player.js"></script>

    <link href="https://cdn.jsdelivr.net/npm/daisyui@4.10.2/dist/full.min.css" rel="stylesheet" type="text/css" />
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
</head>
<body class="bg-base-200  h-[100vh]"
      @keydown.right.window.debounce="resumePlayback"
      @keydown.left.window="goBack"
      x-data="slidePlayer">

    <video muted
           style="object-fit: cover;"
           class="w-[100vw] max-h-[95vh]"
           :controls="enableControls"
           @click="resumePlayback"
           id="slide-video"
           @timeupdate="updateTime"
           playsinline
           :src="src"></video>

    <div
         class="w-full flex flex-col md:flex-row justify-center items-center gap-4 px-4 py-3 bg-base-200 border-t border-base-300 shadow-inner text-center">
        <button class="btn btn-sm w-full md:w-auto" @click="goBack" :disabled="busy">
            <i class="fas fa-arrow-left mr-2"></i>
            Previous
        </button>

        <!-- Open the modal using ID.showModal() method -->
        <dialog id="overview" class="modal modal-bottom sm:modal-middle">
            <div class="modal-box sm:w-11/12 max-w-5xl max-h-[40vh]">

                <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                    <template x-if="thumbs">
                        <template x-for="(s, index) in pauses" :key="s">
                            <div class="relative" x-data="{ visible: false }" x-intersect.once="visible = true">
                                <!-- Slide nummer -->
                                <div class="absolute top-2 left-2 bg-base-100 text-sm text-base-content px-2 py-1 rounded shadow">
                                    Slide <span x-text="index + 1"></span>
                                </div>

                                <!-- Thumbnail video -->
                                <template x-if="visible">
                                    <video
                                            class="rounded shadow-md w-full aspect-video object-cover cursor-pointer"
                                            @click="video.currentTime = s; $refs.overview.close()"
                                            preload="metadata"
                                            muted
                                            playsinline
                                            :src="`${src}#t=${s}`">
                                    </video>
                                </template>

                                <!-- (optioneel) skeleton placeholder -->
                                <template x-if="!visible">
                                    <div class="rounded w-full aspect-video bg-base-300 animate-pulse"></div>
                                </template>
                            </div>
                        </template>
                    </template>
                </div>

            </div>

            <form method="dialog" class="modal-backdrop">
                <button>close</button>
            </form>
        </dialog>
        <div id="indicator"
             @click="thumbs=true;document.getElementById('overview').showModal()"
             class="badge badge-outline text-sm px-3 py-2 navb cursor-pointer">
            Slide: <span x-text="pauses.indexOf(stoppedOn) + 1"></span> /
            <span x-text="pauses.length"></span>
        </div>

        <label class="flex items-center gap-2 cursor-pointer text-sm">
            <input type="checkbox" class="checkbox checkbox-sm" x-model="enableControls" />
            <span>video controls</span>
        </label>

        <button class="btn btn-sm w-full md:w-auto navb" @click="resumePlayback" :disabled="busy">
            Next
            <i class="fas fa-arrow-right ml-2"></i>
        </button>
    </div>

</body>
</html>
